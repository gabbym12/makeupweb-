<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In - GlamLab Studio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <div class="login-wrap">
    <div class="login-card">
      <h1>💄 GlamLab Studio</h1>
      <p class="sub" style="text-align:center">Log in to enter the studio and play!</p>
      <div style="text-align:right"><button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button></div>
      <div class="tabs">
        <button type="button" id="tabLogin" class="active" onclick="setTab('login')">Log In</button>
        <button type="button" id="tabSignup" onclick="setTab('signup')">Sign Up</button>
      </div>
      <form id="authForm" onsubmit="submitAuth(event)" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="e.g. glamqueen" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn" id="submitBtn" type="submit">Enter ✨</button>
        <div id="authMsg"></div>
      </form>
      <p class="note">Accounts are saved in your browser only (localStorage).</p>
    </div>
  </div>
</main>
<script src="theme.js"></script>
<script src="auth.js"></script>
<script>
let mode = 'login';
function setTab(m) {
  mode = m;
  document.getElementById('tabLogin').className = m === 'login' ? 'active' : '';
  document.getElementById('tabSignup').className = m === 'signup' ? 'active' : '';
  document.getElementById('submitBtn').textContent = m === 'login' ? 'Enter ✨' : 'Create Account ✨';
  document.getElementById('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  msg('');
}
function msg(text, cls) {
  const el = document.getElementById('authMsg');
  el.textContent = text; el.className = cls || '';
}
function submitAuth(event) {
  event.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const res = mode === 'login' ? login(u, p) : signup(u, p);
  if (res.ok) {
    msg('Welcome, ' + u.trim() + '! 💖', 'ok');
    const next = new URLSearchParams(location.search).get('next');
    setTimeout(function () { window.location.href = next || 'index.html'; }, 500);
  } else {
    msg(res.msg, 'err');
  }
}
// Already logged in? Skip the login page.
if (currentUser()) window.location.href = 'index.html';
</script>
</body>
</html>
